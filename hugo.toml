baseURL = "https://midwestsec.com/"
defaultContentLanguage = "en"
locale = "en-US"
title = "MidwestSec"
theme = "hugo-theme-stack"


[pagination]
  pagerSize = 10

[params]
  mainSections = ["blog", "walkthroughs"]
  featuredImageField = "image"
  rssFullContent = true
  custom_css = ["scss/custom.scss"]
  favicon = "images/favicon.png"

[params.comments]
  enabled = false

[params.sidebar]
  subtitle = "Learning. Breaking. Defending."
  avatar = "images/MidwestSec_bw.png"

[params.article]
  math = false
  toc = true
  readingTime = true
  headingAnchor = true

[[params.widgets.page]]
  type = "toc"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params.footer]
  since = 2026
  customText = ""

